# ============================================================
# JobHunter v2 — PostgreSQL + pgvector
# ============================================================
# 启动:
#   docker compose up -d postgres
#
# 停止:
#   docker compose down postgres
#
# 连接:
#   psql -U jobhunter -d jobhunter -h localhost -p 5432
#
# 验证 pgvector 是否安装成功:
#   docker compose exec postgres psql -U jobhunter -d jobhunter -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';"
#
# 密码配置:
#   容器密码从宿主机的 .env 文件读取,不再硬编码。
#   使用前请在项目根目录建一份 .env,至少包含:
#     POSTGRES_USER=jobhunter
#     POSTGRES_PASSWORD=<你自己设的强密码>
#     POSTGRES_DB=jobhunter
#   .env 已被 .gitignore 屏蔽,不会进 git。
#   复制模板:cp .env.example .env

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobhunter-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
