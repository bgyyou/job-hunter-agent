[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
# v1 FROZEN P0-002：real_llm 默认 deselect，CI 永不红。
# 开发者本地显式 opt-in：`pytest -m real_llm tests/integration/test_flow_a_real_llm_3_scenarios.py`。
# 命令行 -m 优先级 > addopts，所以显式传 -m real_llm 仍可跑（pytest 多 -m 后者覆盖前者）。
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not real_llm"
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    requires_model: tests that download or load a real ML model
    real_llm: tests that call the real LLM API (require LLM_API_KEY; deselected by default)
